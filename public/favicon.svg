<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="edenVolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Stadium Border Shield -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#070A08" stroke="#10B981" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle Pitch Chalk Markings Inside -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="3,3" />
  <line x1="50" y1="12" x2="50" y2="88" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" />

  <!-- Kinetic Architectural 'E' Emblem made of pitch boundary lines -->
  <path d="M 30 24 L 72 24 L 72 34 L 43 34 L 43 45 L 66 45 L 66 55 L 43 55 L 43 66 L 74 66 L 74 76 L 30 76 Z" 
        fill="url(#edenVolt)" 
        filter="url(#glow)" />
        
  <!-- Floodlight Spark Accent -->
  <circle cx="74" cy="24" r="3.5" fill="#D4FF00" />
</svg>